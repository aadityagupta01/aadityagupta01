<svg xmlns="http://www.w3.org/2000/svg" width="150" height="170" viewBox="0 0 150 170" role="img" aria-label="Gmail" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B5E"/><stop offset="1" stop-color="#D93025"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="15" y="12" width="120" height="120" rx="30"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <style>
    .card  { animation: float 3s ease-in-out infinite; animation-delay: -2s; }
    .glow  { animation: glow 3s ease-in-out infinite; animation-delay: -2s; }
    .ring  { fill: none; stroke: #D93025; stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center;
             animation: ring 3s ease-out infinite; animation-delay: -2s; }
    .shine { animation: shine 4s ease-in-out infinite; animation-delay: -2s; }
    .shadow{ animation: shadow 3s ease-in-out infinite; animation-delay: -2s; transform-box: fill-box; transform-origin: center; }
    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes glow   { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
    @keyframes ring   { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.28); } }
    @keyframes shine  { 0% { transform: translateX(-120px); } 55%,100% { transform: translateX(150px); } }
    @keyframes shadow { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(.82); opacity: .3; } }
  </style>

  <ellipse class="shadow" cx="75" cy="152" rx="44" ry="6" fill="#000" filter="url(#soft)"/>

  <g class="card">
    <rect class="glow" x="20" y="22" width="110" height="110" rx="30" fill="#D93025" filter="url(#blur)"/>
    <rect class="ring" x="15" y="12" width="120" height="120" rx="30"/>
    <rect x="15" y="12" width="120" height="120" rx="30" fill="url(#g)"/>
    <rect x="15.75" y="12.75" width="118.5" height="118.5" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <g clip-path="url(#clip)">
      <rect class="shine" x="0" y="0" width="46" height="170" fill="url(#shine)" transform="skewX(-18)"/>
    </g>
    <g transform="translate(45 42) scale(2.5)">
      <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#000" opacity=".22" transform="translate(0.25 0.35)"/>
      <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#fff"/>
    </g>
  </g>
</svg>
