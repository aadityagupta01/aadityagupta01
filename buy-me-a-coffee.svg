<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Buy me a coffee" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="0.5" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D6E2"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5A2B"/>
      <stop offset="1" stop-color="#4A2C12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC21A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFC21A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <style>
    .float { animation: float 3.2s ease-in-out infinite; }
    .floatcup { animation: float 3.2s ease-in-out infinite; animation-delay: -0.6s; }
    .steam { fill: none; stroke: #E8F1F8; stroke-width: 5; stroke-linecap: round; opacity: 0; animation: steam 2.8s ease-in-out infinite; }
    .s2 { animation-delay: 0.9s; }
    .s3 { animation-delay: 1.8s; }
    .sub { animation: pulse 2.4s ease-in-out infinite; }
    .glow { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(14px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-26px); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <ellipse class="glow" cx="450" cy="140" rx="430" ry="115" fill="url(#glow)"/>
  <ellipse cx="150" cy="250" rx="85" ry="8" fill="#000" opacity=".45" filter="url(#blur)"/>

  <!-- coffee cup -->
  <g class="floatcup">
    <path class="steam"    d="M120 105 C108 90, 132 78, 120 62 C110 50, 128 42, 122 30"/>
    <path class="steam s2" d="M150 105 C138 90, 162 78, 150 62 C140 50, 158 42, 152 30"/>
    <path class="steam s3" d="M180 105 C168 90, 192 78, 180 62 C170 50, 188 42, 182 30"/>
    <ellipse cx="150" cy="234" rx="92" ry="14" fill="#9FB3C4"/>
    <ellipse cx="150" cy="230" rx="92" ry="14" fill="url(#cup)"/>
    <path d="M222 140 C262 136, 262 200, 218 196" fill="none" stroke="#B8C7D5" stroke-width="14" stroke-linecap="round"/>
    <path d="M222 140 C256 138, 256 196, 218 192" fill="none" stroke="#F4F8FB" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 120 H230 C230 190, 205 230, 150 230 C95 230, 70 190, 70 120 Z" fill="url(#cup)"/>
    <path d="M70 120 H230 C230 190, 205 230, 150 230" fill="none" stroke="#A9BBCB" stroke-width="3" opacity=".7"/>
    <ellipse cx="150" cy="120" rx="80" ry="14" fill="#E9EEF3"/>
    <ellipse cx="150" cy="122" rx="70" ry="10" fill="url(#coffee)"/>
    <path d="M90 140 C92 175, 104 200, 122 216" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>

